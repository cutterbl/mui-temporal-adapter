name: Release

# Must be named exactly "Release" — storybook-deploy.yml's workflow_run trigger matches on
# this name, not the filename.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tag, changelog commit, GitHub Release
  id-token: write # npm OIDC / Trusted Publisher — no NPM_TOKEN secret anywhere in this repo
  issues: write # @semantic-release/github's optional issue/PR comments
  pull-requests: write

jobs:
  ci-checks:
    name: CI checks
    uses: ./.github/workflows/ci-checks.yml

  release:
    name: semantic-release
    needs: ci-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags to compute the next version

      - name: Set up pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted Publishing (OIDC) needs npm CLI >= 11.5.1; don't rely on whatever ships with
      # the Node runtime image.
      - name: Ensure a recent enough npm for OIDC/Trusted Publishing
        run: npm install -g npm@latest

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — npm authenticates via OIDC against the Trusted Publisher configured
          # on the package's npmjs.com settings. See memory/DECISIONS.md.
