name: Release

# Must be named exactly "Release" — storybook-deploy.yml's workflow_run trigger matches on
# this name, not the filename.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tag, changelog commit, GitHub Release
  id-token: write # npm OIDC / Trusted Publisher — no NPM_TOKEN secret anywhere in this repo
  issues: write # @semantic-release/github's optional issue/PR comments
  pull-requests: write

jobs:
  # No ci-checks job here on purpose: branch protection on `main` already requires validate.yml's
  # checks to pass before any PR can merge, so by the time a push lands on `main`, it's already
  # been validated — re-running typecheck/lint/coverage/build here would just duplicate that same
  # work a second time for no benefit. (The one push to `main` that skips PR review entirely is
  # this workflow's own `chore(release)` commit-back, which only ever touches package.json's
  # version and CHANGELOG.md — no source changes to re-validate.)
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      # `@semantic-release/git` pushes the version/changelog commit straight to `main`, which
      # branch protection's required-status-checks rule can never satisfy for a brand-new commit
      # (the check can't have run against a SHA that doesn't exist upstream yet — that mechanism
      # is built around PR merges, not direct pushes). The default GITHUB_TOKEN authenticates as
      # the `github-actions[bot]` identity, which isn't exempt regardless of `enforce_admins`.
      # RELEASE_GITHUB_TOKEN is a fine-grained PAT (Contents: read/write only) belonging to the
      # repo owner, used only so this one push lands as an actual admin account — everything
      # else (npm publish, the GitHub Release itself) still goes through OIDC/the default token.
      # See memory/DECISIONS.md.
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags to compute the next version
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Set up pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `ci-checks.yml`'s own `pnpm run build` runs in a completely separate job/runner — nothing
      # carries over between jobs without an explicit artifact upload/download. Without this step,
      # `npm publish` below would pack a tarball with no `dist/` at all (confirmed: an earlier
      # attempt actually did this — the published tarball listing showed only LICENSE, README.md,
      # and package.json). See memory/DECISIONS.md.
      - name: Build the package
        run: pnpm run build

      # Trusted Publishing (OIDC) needs npm CLI >= 11.5.1; don't rely on whatever ships with
      # the Node runtime image. `npm install -g npm@latest` alone isn't enough to trust blindly —
      # a prior run got a misleading `ENEEDAUTH` from the actual `npm publish` subprocess despite
      # @semantic-release/npm's own separate OIDC preflight check succeeding moments earlier, a
      # documented npm CLI gotcha (npm/cli#9088) usually caused by the *upgraded* npm not actually
      # being what's resolved on PATH for later steps. Prepend its real global bin dir to
      # GITHUB_PATH explicitly and print the version that's actually resolved, so this either
      # provably fixes it or gives a real diagnostic instead of guessing again. See DECISIONS.md.
      - name: Ensure a recent enough npm for OIDC/Trusted Publishing
        run: |
          npm install -g npm@latest
          npm_bin_dir="$(npm config get prefix)/bin"
          echo "$npm_bin_dir" >> "$GITHUB_PATH"
          echo "npm just installed at $npm_bin_dir, version: $("$npm_bin_dir/npm" --version)"

      # GITHUB_PATH edits only take effect in later steps, not the one that wrote them — this
      # step is what actually confirms what `npm publish` (spawned during the Release step below)
      # will resolve.
      - name: Verify the npm version later steps will actually use
        run: |
          echo "npm resolved at: $(command -v npm)"
          echo "npm version: $(npm --version)"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — npm authenticates via OIDC against the Trusted Publisher configured
          # on the package's npmjs.com settings. See memory/DECISIONS.md.
